[tool.poetry]
name = "outfit-app"
version = "0.1.0"
description = "Personal outfit recommendation API"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
sqlalchemy = "^2.0.35"
psycopg2-binary = "^2.9.9"
pydantic = "^2.9.0"
requests = "^2.32.0"
boto3 = "^1.35.0"
anthropic = "^0.40.0"
python-dotenv = "^1.0.1"
python-multipart = "^0.0.12"  # required by FastAPI for UploadFile/File(...)

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"