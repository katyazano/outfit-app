services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: outfit_app
      POSTGRES_PASSWORD: outfit_app
      POSTGRES_DB: outfit_app
    ports:
      - "5432:5432"
    volumes:
      - outfit_app_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outfit_app"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  outfit_app_pgdata: